; Parksystem - ein Raspberry Pi Pico W
; Bauen/Hochladen:   pio run -e pico -t upload
; Tests (ohne Pico): pio test -e native

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Die Unit-Tests laufen auf dem PC (env:native), nicht auf dem Pico
test_ignore = *

; Upload per Kopieren der UF2-Datei auf das RPI-RP2 Laufwerk
; (Pico im BOOTSEL-Modus). Laufwerksbuchstabe ggf. anpassen.
upload_protocol = mbed
upload_port = D:

; Automatisierte Tests auf dem PC: Logik aus lib/parksystem + Test Doubles.
; Benoetigt einen GCC fuer den PC (Windows: MinGW-w64, z.B. ueber MSYS2).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
