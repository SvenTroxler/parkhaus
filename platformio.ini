; Parksystem - ein Raspberry Pi Pico W
; Bauen/Hochladen:  pio run -t upload

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Upload per Kopieren der UF2-Datei auf das RPI-RP2 Laufwerk
; (Pico im BOOTSEL-Modus). Laufwerksbuchstabe ggf. anpassen.
upload_protocol = mbed
upload_port = D:
